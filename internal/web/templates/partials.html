{{define "header"}}<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}} - OCI Panel</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
{{if .Username}}
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-brand">OCI Panel</div>
    <nav class="sidebar-nav">
      <a href="/tenants" class="{{if eq .Active "tenants"}}active{{end}}">租户管理</a>
      <a href="/instances" class="{{if eq .Active "instances"}}active{{end}}">实例列表</a>
      <a href="/security-rules" class="{{if eq .Active "security-rules"}}active{{end}}">安全规则</a>
      <a href="/costs" class="{{if eq .Active "costs"}}active{{end}}">费用统计</a>
      <a href="/settings" class="{{if eq .Active "settings"}}active{{end}}">设置</a>
    </nav>
    <div class="sidebar-footer">
      <span class="muted small">{{.Username}}</span>
      <form method="post" action="/logout" class="inline">
        <button type="submit" class="link-btn">退出</button>
      </form>
    </div>
  </aside>
  <main class="content">
{{end}}{{end}}

{{define "footer"}}
{{if .Username}}
  </main>
</div>
{{end}}
</body>
</html>{{end}}
