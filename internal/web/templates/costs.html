{{template "header" .}}

<div class="page-head">
  <h1>费用统计</h1>
  <p class="muted">每天 8:00 自动同步各账号费用（计算/存储/网络/其他），点击「明细」查看当天各账号分类费用</p>
</div>

<section class="card">
  <div class="filter-bar" style="flex-wrap:wrap; gap:12px;">
    <div class="date-preset" style="display:flex; gap:6px;">
      <button class="btn sm date-btn" data-preset="today">今日</button>
      <button class="btn sm date-btn" data-preset="7">近7天</button>
      <button class="btn sm date-btn primary" data-preset="30">近30天</button>
      <button class="btn sm date-btn" data-preset="custom">自定义</button>
    </div>
    <div id="customDateRange" style="display:none; align-items:center; gap:6px;">
      <input type="date" id="startDate" style="padding:4px 6px;">
      <span class="muted">~</span>
      <input type="date" id="endDate" style="padding:4px 6px;">
    </div>
    <button class="btn sm primary" onclick="queryCosts()">🔍 查询</button>
    <button class="btn sm" id="syncBtn" onclick="syncCosts()">⟳ 立即同步</button>
    <span id="queryStatus" class="muted small"></span>
  </div>
</section>

<!-- 汇总卡片 -->
<section id="summaryCards" style="display:none; margin-top:12px; gap:10px; flex-wrap:wrap;">
  <div class="card" style="flex:1; min-width:140px; text-align:center;">
    <div class="muted small">总费用</div>
    <div id="sumTotal" style="font-size:22px; font-weight:600; color:#d32f2f;">-</div>
  </div>
  <div class="card" style="flex:1; min-width:140px; text-align:center;">
    <div class="muted small">计算</div>
    <div id="sumCompute" style="font-size:22px; font-weight:600;">-</div>
  </div>
  <div class="card" style="flex:1; min-width:140px; text-align:center;">
    <div class="muted small">存储</div>
    <div id="sumStorage" style="font-size:22px; font-weight:600;">-</div>
  </div>
  <div class="card" style="flex:1; min-width:140px; text-align:center;">
    <div class="muted small">网络</div>
    <div id="sumNetwork" style="font-size:22px; font-weight:600;">-</div>
  </div>
  <div class="card" style="flex:1; min-width:140px; text-align:center;">
    <div class="muted small">其他</div>
    <div id="sumOther" style="font-size:22px; font-weight:600;">-</div>
  </div>
</section>

<section class="card" style="margin-top:12px;">
  <h2 style="margin-top:0;">每日费用</h2>
  <div class="table-wrap">
<table class="table">
    <thead>
      <tr>
        <th>日期</th>
        <th class="num">计算</th>
        <th class="num">存储</th>
        <th class="num">网络</th>
        <th class="num">其他</th>
        <th class="num">合计</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="dailyTbody">
      <tr><td colspan="7" class="muted center">暂无数据，请点击「⟳ 立即同步」从 Oracle 拉取费用</td></tr>
    </tbody>
  </table>
</div>
</section>

<!-- 二级弹窗：某天各租户费用 -->
<div id="dayTenantsModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:200; align-items:center; justify-content:center;">
  <div style="background:#fff; border-radius:8px; padding:20px; width:90%; max-width:820px; max-height:80vh; overflow:hidden; display:flex; flex-direction:column;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h3 id="dayTenantsTitle" style="margin:0;">各账号费用</h3>
      <button class="btn sm" onclick="closeDayTenants()">关闭</button>
    </div>
    <div style="flex:1; overflow:auto;">
      <div class="table-wrap">
<table class="table" style="font-size:13px;">
        <thead>
          <tr>
            <th>租户名</th>
            <th class="num">计算</th>
            <th class="num">存储</th>
            <th class="num">网络</th>
            <th class="num">其他</th>
            <th class="num">合计</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="dayTenantsTbody">
        </tbody>
      </table>
</div>
    </div>
  </div>
</div>

<!-- 三级弹窗：单租户单天 SKU 明细 -->
<div id="detailModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:300; align-items:center; justify-content:center;">
  <div style="background:#fff; border-radius:8px; padding:20px; width:90%; max-width:960px; max-height:80vh; overflow:hidden; display:flex; flex-direction:column;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h3 id="detailTitle" style="margin:0;">费用明细</h3>
      <button class="btn sm" onclick="closeDetail()">关闭</button>
    </div>
    <div style="flex:1; overflow:auto;">
      <div class="table-wrap">
<table class="table" style="font-size:13px;">
        <thead>
          <tr>
            <th>日期</th>
            <th>资源类型</th>
            <th>SKU 名称</th>
            <th>资源名称</th>
            <th>资源 ID</th>
            <th class="num">费用</th>
          </tr>
        </thead>
        <tbody id="detailTbody">
        </tbody>
      </table>
</div>
    </div>
  </div>
</div>

<script>
let currentCurrency = 'USD';

// HTML 转义，防止用户/OCI 数据注入
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}
function daysAgoStr(n) {
  const d = new Date();
  d.setUTCDate(d.getUTCDate() - n);
  return d.toISOString().slice(0, 10);
}

document.querySelectorAll('.date-btn').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.date-btn').forEach((b) => b.classList.remove('primary'));
    btn.classList.add('primary');
    const preset = btn.dataset.preset;
    const custom = document.getElementById('customDateRange');
    if (preset === 'today') {
      document.getElementById('startDate').value = todayStr();
      document.getElementById('endDate').value = todayStr();
      custom.style.display = 'none';
    } else if (preset === '7' || preset === '30') {
      const n = parseInt(preset, 10);
      document.getElementById('startDate').value = daysAgoStr(n - 1);
      document.getElementById('endDate').value = todayStr();
      custom.style.display = 'none';
    } else if (preset === 'custom') {
      custom.style.display = 'flex';
    }
  });
});

// 初始化：近30天
document.getElementById('startDate').value = daysAgoStr(29);
document.getElementById('endDate').value = todayStr();

function fmt(n, currency) {
  const v = Number(n || 0).toFixed(2);
  const c = currency || currentCurrency;
  const symbol = c === 'SGD' ? 'S$' : c === 'CNY' ? '¥' : '$';
  return `${symbol}${v}`;
}

// ============ 一级：按天读取（读库） ============
async function queryCosts() {
  const startDate = document.getElementById('startDate').value;
  const endDate = document.getElementById('endDate').value;
  if (!startDate || !endDate) { alert('请选择日期'); return; }
  const days = Math.round((new Date(endDate) - new Date(startDate)) / 86400000) + 1;
  if (days > 180) { alert('最多查询 180 天'); return; }

  const status = document.getElementById('queryStatus');
  status.textContent = '查询中...';
  document.getElementById('dailyTbody').innerHTML = '<tr><td colspan="7" class="muted center">加载中...</td></tr>';

  try {
    const resp = await fetch(`/api/costs/daily?startDate=${startDate}&endDate=${endDate}`);
    const data = await resp.json();
    if (!data.ok) throw new Error(data.error);

    renderSummary(data);
    renderDaily(data);
    status.textContent = data.days.length
      ? `共 ${data.days.length} 天（数据来自每日 8:00 定时同步）`
      : '该日期范围暂无数据，请点击「⟳ 立即同步」';
  } catch (e) {
    document.getElementById('dailyTbody').innerHTML = `<tr><td colspan="7" class="muted center" style="color:#d32f2f;">查询失败: ${esc(e.message)}</td></tr>`;
    status.textContent = '';
  }
}

function renderSummary(data) {
  currentCurrency = data.currency || (data.days && data.days[0] && data.days[0].currency) || 'USD';
  document.getElementById('summaryCards').style.display = 'flex';
  document.getElementById('sumTotal').textContent = fmt(data.summary.total);
  document.getElementById('sumCompute').textContent = fmt(data.summary.compute);
  document.getElementById('sumStorage').textContent = fmt(data.summary.storage);
  document.getElementById('sumNetwork').textContent = fmt(data.summary.network);
  document.getElementById('sumOther').textContent = fmt(data.summary.other);
}

function renderDaily(data) {
  const tbody = document.getElementById('dailyTbody');
  if (!data.days || data.days.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="muted center">该日期范围无费用数据</td></tr>';
    return;
  }
  tbody.innerHTML = data.days.map((d) => `
    <tr>
      <td>${esc(d.date)}</td>
      <td class="num small">${fmt(d.compute, d.currency)}</td>
      <td class="num small">${fmt(d.storage, d.currency)}</td>
      <td class="num small">${fmt(d.network, d.currency)}</td>
      <td class="num small">${fmt(d.other, d.currency)}</td>
      <td class="num" style="font-weight:600; color:${d.total > 0 ? '#d32f2f' : 'inherit'};">${fmt(d.total, d.currency)}</td>
      <td><button class="btn sm" onclick='openDayTenants(${esc(JSON.stringify(d))})'>📋 明细</button></td>
    </tr>
  `).join('');
}

// ============ 手动同步（实时查 OCI 并落库） ============
async function syncCosts() {
  const btn = document.getElementById('syncBtn');
  const status = document.getElementById('queryStatus');
  btn.disabled = true;
  btn.textContent = '同步中...';
  status.textContent = '正在从 Oracle 拉取费用数据...';
  try {
    const resp = await fetch('/api/costs/sync', { method: 'POST' });
    const data = await resp.json();
    if (data.error) {
      status.textContent = '部分账号同步失败：' + data.error;
    } else {
      const totalDays = (data.tenants || []).reduce((s, t) => s + t.days, 0);
      status.textContent = `同步完成（${totalDays} 天数据）`;
    }
    await queryCosts();
  } catch (e) {
    status.textContent = '同步失败: ' + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = '⟳ 立即同步';
  }
}

// ============ 二级：某天各租户费用 ============
function openDayTenants(day) {
  document.getElementById('dayTenantsTitle').textContent = `${day.date} 各账号费用`;
  document.getElementById('dayTenantsModal').style.display = 'flex';
  const tbody = document.getElementById('dayTenantsTbody');
  if (!day.tenants || day.tenants.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="muted center">该日无数据</td></tr>';
    return;
  }
  // 合计高的排前面
  const list = [...day.tenants].sort((a, b) => b.total - a.total);
  tbody.innerHTML = list.map((t) => `
    <tr>
      <td>${esc(t.name)}</td>
      <td class="num small">${fmt(t.compute, t.currency)}</td>
      <td class="num small">${fmt(t.storage, t.currency)}</td>
      <td class="num small">${fmt(t.network, t.currency)}</td>
      <td class="num small">${fmt(t.other, t.currency)}</td>
      <td class="num" style="font-weight:600; color:${t.total > 0 ? '#d32f2f' : 'inherit'};">${fmt(t.total, t.currency)}</td>
      <td><button class="btn sm" onclick="openDetail(${t.id}, '${esc(day.date)}', '${esc(day.date)}')">📋 明细</button></td>
    </tr>
  `).join('');
}

function closeDayTenants() {
  document.getElementById('dayTenantsModal').style.display = 'none';
}

// ============ 三级：单租户单天 SKU 明细（实时查 OCI） ============
async function openDetail(tenantId, startDate, endDate) {
  document.getElementById('detailTitle').textContent = `费用明细 — ${startDate}`;
  document.getElementById('detailModal').style.display = 'flex';
  document.getElementById('detailTbody').innerHTML = '<tr><td colspan="6" class="muted center">加载中...</td></tr>';

  try {
    const resp = await fetch(`/api/costs/details?tenantId=${tenantId}&startDate=${startDate}&endDate=${endDate}`);
    const data = await resp.json();
    if (!data.ok) throw new Error(data.error);

    data.items.sort((a, b) => b.computedAmount - a.computedAmount);
    const tbody = document.getElementById('detailTbody');
    if (data.items.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="muted center">无明细（该日无费用或免费额度覆盖）</td></tr>';
    } else {
      tbody.innerHTML = data.items.map((i) => `
        <tr>
          <td class="muted small">${esc(i.date)}</td>
          <td><span class="tag">${esc(i.category)}</span></td>
          <td class="small">${esc(i.skuName)}</td>
          <td class="small">${esc(i.resourceName)}</td>
          <td class="mono small" title="${esc(i.resourceId)}">${esc(i.resourceId.slice(0, 24))}...</td>
          <td class="num" style="font-weight:600; color:${i.computedAmount > 0 ? '#d32f2f' : 'inherit'};">${fmt(i.computedAmount, i.currency)}</td>
        </tr>
      `).join('');
    }
  } catch (e) {
    document.getElementById('detailTbody').innerHTML = `<tr><td colspan="6" class="muted center" style="color:#d32f2f;">加载失败: ${esc(e.message)}</td></tr>`;
  }
}

function closeDetail() {
  document.getElementById('detailModal').style.display = 'none';
}

// 进页面自动查一次（读库，不发 OCI 请求）
queryCosts();
</script>

{{template "footer" .}}
